<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>osok</title>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            overflow: hidden;
            position: relative;
        }

        /* 배경 블롭 */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: blobFloat 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .bg-blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, #ee0979);
            top: -150px; left: -100px;
            animation-delay: 0s;
        }

        .bg-blob:nth-child(2) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #a8edea, #fed6e3);
            bottom: -100px; right: -80px;
            animation-delay: -3s;
        }

        .bg-blob:nth-child(3) {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #f7971e, #ffd200);
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        .bg-blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #4facfe, #00f2fe);
            bottom: 10%; left: 10%;
            animation-delay: -2s;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            33% { transform: translateY(-30px) scale(1.05); }
            66% { transform: translateY(20px) scale(0.95); }
        }

        /* 이모지 파티클 */
        .emoji-particle {
            position: fixed;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 0;
            animation: particleFloat linear infinite;
            opacity: 0.7;
        }

        @keyframes particleFloat {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* 메인 카드 */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .title span {
            background: linear-gradient(135deg, #f7971e, #ffd200, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 드롭존 */
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .drop-zone:hover {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.12);
        }

        .drop-zone.dragging {
            border-color: #ffd200;
            background: rgba(255, 210, 0, 0.15);
            box-shadow: 0 0 20px rgba(255, 210, 0, 0.3);
            transform: scale(1.02);
        }

        .drop-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .drop-hint {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* 파일 목록 */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .file-icon { font-size: 1rem; }
        .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { opacity: 0.6; font-size: 0.75rem; white-space: nowrap; }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 0.7rem;
        }

        .btn {
            flex: 1;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-text {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
        }

        .btn-text:hover {
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
        }

        .btn-upload {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3);
        }

        .btn-upload:hover {
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.4);
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            resize: vertical;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            display: none;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }

        textarea.visible {
            display: block;
        }

        /* 세션 키 표시 */
        #msg {
            text-align: center;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .session-key {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.3rem;
            color: white;
            text-shadow: 0 0 30px rgba(255, 210, 0, 0.8), 0 0 60px rgba(255, 210, 0, 0.4);
            animation: keyPulse 1.5s ease-in-out infinite;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .session-key:hover {
            transform: scale(1.05);
        }

        .session-key:active {
            transform: scale(0.97);
        }

        .copy-toast {
            position: absolute;
            top: -2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(67, 233, 123, 0.9);
            color: #000;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            white-space: nowrap;
            animation: toastPop 1.5s ease forwards;
            pointer-events: none;
        }

        @keyframes toastPop {
            0% { opacity: 0; transform: translateX(-50%) translateY(4px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
        }

        @keyframes keyPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* 상태 표시 */
        #status {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.2rem;
        }

        .status-uploading {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-ok { color: #43e97b; }
        .status-err { color: #f5576c; }
    </style>
</head>

<body>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>

    <div class="container">
        <div class="title">✈️ <span>osok</span></div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">📂</div>
            <div>파일을 여기에 드래그하거나 클릭하세요</div>
            <div class="drop-hint">여러 파일 선택 시 ZIP으로 자동 압축</div>
        </div>

        <div class="file-list" id="fileList"></div>

        <div id="msg" style="position:relative;"></div>

        <textarea id="textInput" placeholder="텍스트를 입력하세요..."></textarea>

        <div class="btn-group">
            <a class="btn" id="btnFile">📎 파일</a>
            <a class="btn btn-text" id="btnText">📝 텍스트</a>
        </div>

        <div id="status"></div>
    </div>

    <input hidden type='file' id='uploader' accept='*' multiple />
    <script src='/static/index.js'></script>
</body>

</html>
