<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>osok</title>
    <script
      src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f6f8fc;
        --surface: rgba(255, 255, 255, 0.72);
        --surface-strong: rgba(255, 255, 255, 0.9);
        --outline: rgba(40, 46, 78, 0.1);
        --text: #20243a;
        --text-soft: rgba(32, 36, 58, 0.62);
        --blue: #3279f9;
        --red: #fc413d;
        --green: #00b95c;
        --yellow: #fbbc04;
      }

      body {
        font-family:
          "Google Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fff;
        overflow: hidden;
        position: relative;
        color: var(--text);
      }

      .bg-scene {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      #bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 메인 카드 */
      .container {
        position: relative;
        z-index: 1;
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border: 1px solid var(--outline);
        padding: 2.5rem;
        border-radius: 24px;
        box-shadow:
          0 28px 70px rgba(66, 81, 123, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.75);
        width: 90%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
      }

      .title {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.5px;
        text-align: center;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .title span {
        background: linear-gradient(
          135deg,
          var(--red),
          var(--yellow),
          var(--blue),
          var(--green)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* 드롭존 */
      .drop-zone {
        border: 2px dashed rgba(50, 121, 249, 0.22);
        border-radius: 16px;
        padding: 2rem 1.5rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.46);
        color: var(--text-soft);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .drop-zone:hover {
        border-color: rgba(50, 121, 249, 0.4);
        background: rgba(255, 255, 255, 0.76);
      }

      .drop-zone.dragging {
        border-color: rgba(251, 188, 4, 0.9);
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 30px rgba(251, 188, 4, 0.2);
        transform: scale(1.02);
      }

      .drop-icon {
        font-size: 2.5rem;
        line-height: 1;
      }

      .drop-hint {
        font-size: 0.9rem;
        opacity: 0.7;
      }

      /* 파일 목록 */
      .file-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        max-height: 150px;
        overflow-y: auto;
      }

      .file-item {
        background: rgba(255, 255, 255, 0.62);
        border-radius: 8px;
        padding: 0.5rem 0.8rem;
        font-size: 0.85rem;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: slideIn 0.2s ease;
        border: 1px solid rgba(40, 46, 78, 0.06);
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .file-icon {
        font-size: 1rem;
      }
      .file-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-size {
        opacity: 0.6;
        font-size: 0.75rem;
        white-space: nowrap;
      }

      /* 버튼 그룹 */
      .btn-group {
        display: flex;
        gap: 0.7rem;
      }

      .btn {
        flex: 1;
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
        border: none;
        padding: 0.75rem 1.2rem;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-text {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
      }

      .btn-text:hover {
        box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
      }

      .btn-upload {
        background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3);
      }

      .btn-upload:hover {
        box-shadow: 0 6px 20px rgba(67, 233, 123, 0.4);
      }

      textarea {
        width: 100%;
        height: 90px;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(40, 46, 78, 0.12);
        border-radius: 12px;
        resize: vertical;
        background: rgba(255, 255, 255, 0.66);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        transition: border-color 0.2s;
        display: none;
      }

      textarea::placeholder {
        color: rgba(32, 36, 58, 0.38);
      }

      textarea:focus {
        outline: none;
        border-color: rgba(50, 121, 249, 0.44);
        background: rgba(255, 255, 255, 0.84);
      }

      textarea.visible {
        display: block;
      }

      /* 세션 키 표시 */
      #msg {
        text-align: center;
        min-height: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .session-key {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 0.3rem;
        color: var(--text);
        text-shadow: 0 0 24px rgba(50, 121, 249, 0.16);
        animation: keyPulse 1.5s ease-in-out infinite;
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s ease;
      }

      .session-key:hover {
        transform: scale(1.05);
      }

      .session-key:active {
        transform: scale(0.97);
      }

      .copy-toast {
        position: absolute;
        top: -2rem;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(67, 233, 123, 0.9);
        color: #000;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        white-space: nowrap;
        animation: toastPop 1.5s ease forwards;
        pointer-events: none;
      }

      @keyframes toastPop {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(4px);
        }
        20% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-6px);
        }
      }

      @keyframes keyPulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      /* 상태 표시 */
      #status {
        color: var(--text-soft);
        font-size: 0.9rem;
        text-align: center;
        min-height: 1.2rem;
      }

      .status-uploading {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(32, 36, 58, 0.16);
        border-top-color: var(--text);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status-ok {
        color: #0f9d58;
      }
      .status-err {
        color: #d93025;
      }

      @media (max-width: 640px) {
        .container {
          padding: 1.5rem;
          gap: 1rem;
          width: min(92vw, 460px);
        }

        .btn-group {
          flex-direction: column;
        }

        .session-key {
          font-size: 2.3rem;
          letter-spacing: 0.22rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg-scene" aria-hidden="true">
      <canvas id="bg-canvas"></canvas>
    </div>

    <div class="container">
      <div class="title">✈️ <span>osok</span></div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">📂</div>
        <div>파일을 여기에 드래그하거나 클릭하세요</div>
        <div class="drop-hint">여러 파일 선택 시 ZIP으로 자동 압축</div>
      </div>

      <div class="file-list" id="fileList"></div>

      <div id="msg" style="position: relative"></div>

      <textarea id="textInput" placeholder="텍스트를 입력하세요..."></textarea>

      <div class="btn-group">
        <a class="btn" id="btnFile">📎 파일</a>
        <a class="btn btn-text" id="btnText">📝 텍스트</a>
      </div>

      <div id="status"></div>
    </div>

    <input hidden type="file" id="uploader" accept="*" multiple />
    <script src="/static/index.js"></script>
  </body>
</html>
